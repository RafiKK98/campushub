name: campushub

x-database-url: &database-url 'postgresql://${POSTGRES_USER:-campushub}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-campushub}?schema=public'

services:
  db:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campushub}
      POSTGRES_USER: ${POSTGRES_USER:-campushub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - campushub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - campushub
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      NODE_ENV: development
      DATABASE_URL: *database-url
      DIRECT_URL: *database-url
      DEMO_PASSWORD: ${DEMO_PASSWORD:-CampusHubDemo!2026}
    depends_on:
      db:
        condition: service_healthy
    command: ['pnpm', 'exec', 'prisma', 'migrate', 'deploy']
    networks:
      - campushub
    restart: 'no'

  api:
    build:
      context: ./backend
      target: runtime
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: '4000'
      HOST: 0.0.0.0
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      FRONTEND_ORIGIN: http://localhost:8080
      AUTH_COOKIE_SECURE: 'false'
      AUTH_COOKIE_SAME_SITE: lax
      TRUST_PROXY: '1'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campushub
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: runtime
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - campushub
    restart: unless-stopped

volumes:
  campushub_postgres_data:
    name: campushub_postgres_data

networks:
  campushub:
    driver: bridge
