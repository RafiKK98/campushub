name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: campushub
          POSTGRES_PASSWORD: campushub_ci
          POSTGRES_DB: campushub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campushub -d campushub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://campushub:campushub_ci@localhost:5432/campushub_test?schema=public
      DIRECT_URL: postgresql://campushub:campushub_ci@localhost:5432/campushub_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir backend db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Validate Prisma schema
        run: pnpm --dir backend db:validate

      - name: Apply database migrations
        run: pnpm --dir backend db:migrate:deploy

      - name: Run backend tests
        run: pnpm --dir backend test

      - name: Run frontend tests
        run: pnpm --dir frontend test

      - name: Build backend
        run: pnpm --dir backend build

      - name: Build frontend
        run: pnpm --dir frontend build

  publish-api:
    name: Publish backend image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/rafikk98/campushub-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=campushub-api
          cache-to: type=gha,mode=max,scope=campushub-api
