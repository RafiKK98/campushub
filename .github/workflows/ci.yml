name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: campushub
          POSTGRES_PASSWORD: campushub_ci
          POSTGRES_DB: campushub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campushub -d campushub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://campushub:campushub_ci@localhost:5432/campushub_test?schema=public
      DIRECT_URL: postgresql://campushub:campushub_ci@localhost:5432/campushub_test?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir backend db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Validate Prisma schema
        run: pnpm --dir backend db:validate

      - name: Apply database migrations
        run: pnpm --dir backend db:migrate:deploy

      - name: Run backend tests
        run: pnpm --dir backend test

      - name: Run frontend tests
        run: pnpm --dir frontend test

      - name: Build backend
        run: pnpm --dir backend build

      - name: Build frontend
        run: pnpm --dir frontend build

  publish-api:
    name: Publish backend image
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/rafikk98/campushub-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=campushub-api
          cache-to: type=gha,mode=max,scope=campushub-api

  migrate-production:
    name: Apply production migrations
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 15
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Apply committed production migrations
        run: pnpm --dir backend db:migrate:deploy

  deploy-backend:
    name: Deploy backend to Vercel
    runs-on: ubuntu-latest
    needs:
      - migrate-production
      - publish-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 20
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@66.6.0

      - name: Link backend Vercel project
        run: vercel link --yes --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"

      - name: Pull backend production settings
        run: vercel pull --yes --environment=production

      - name: Build backend for Vercel
        run: vercel build --prod --yes

      - name: Deploy backend
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --yes | tail -n 1)"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 20
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@66.6.0

      - name: Link frontend Vercel project
        run: vercel link --yes --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"

      - name: Pull frontend production settings
        run: vercel pull --yes --environment=production

      - name: Build frontend for Vercel
        run: vercel build --prod --yes

      - name: Deploy frontend
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --yes | tail -n 1)"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

  smoke-production:
    name: Smoke-test production
    runs-on: ubuntu-latest
    needs:
      - deploy-backend
      - deploy-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Check API health through Vercel
        env:
          BACKEND_URL: ${{ needs.deploy-backend.outputs.deployment_url }}
          FRONTEND_URL: ${{ needs.deploy-frontend.outputs.deployment_url }}
        run: |
          set -euo pipefail
          for url in "$BACKEND_URL/api/health" "$FRONTEND_URL/api/health"; do
            for attempt in {1..12}; do
              body="$(curl --silent --show-error --fail "$url" || true)"
              if printf '%s' "$body" | grep -q '"status":"ok"'; then
                echo "Healthy: $url"
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo "Health check failed: $url" >&2
                exit 1
              fi
              sleep 5
            done
          done

      - name: Check database readiness through Vercel
        env:
          FRONTEND_URL: ${{ needs.deploy-frontend.outputs.deployment_url }}
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            body="$(curl --silent --show-error --fail "$FRONTEND_URL/api/ready" || true)"
            if printf '%s' "$body" | grep -q '"status":"ready"'; then
              echo "Database ready through $FRONTEND_URL"
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Readiness check failed" >&2
              exit 1
            fi
            sleep 5
          done
